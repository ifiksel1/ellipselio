/**:
    ros__parameters:

        mapping:
            # Floor is 0.1 m. Raise to 0.15-0.2 if RAM-bound on Orin NX 8GB
            # (watch /analytics.ram_usage; kMaxMapPoints preallocates large pools).
            map_resolution: 0.2
            pub_map_n_secs: 10

        lidar:
            type: 3                  # LIVOX=1, VELODYNE=2, OUSTER=3, HESAI=4
            rate: 20                 # THIS RIG RUNS 20Hz (1024x20). NCD configs use 10 — a 2x error
                                     # here mis-associates IMU<->LiDAR (match_idx=floor(dt*rate)) and
                                     # breaks deskew (scan_time=1/rate) -> EKF runs away under motion.
            scan_lines: 64
            vertical_fov: 42.4       # TUNE-CRITICAL for OS1-64; wrong value silently degrades accuracy
            min_range: 0.3
            max_range: 80.0
            topic: "/ouster/points"  # live Ouster ROS2 driver (was /os1_cloud_node/points for NCD bags)
            # Extrinsic for THIS rig (OS1-64 built-in ICM-20948, IMU yaw-flipped vs LiDAR).
            # Matches the validated SuperOdom/FAST-LIO calibration on this drone.
            t_imu_lidar: [-0.006253, 0.011775, 0.028535]
            r_imu_lidar: [-1.,  0.,  0.,
                           0., -1.,  0.,
                           0.,  0.,  1.]

        imu:
            rate: 100
            acc_noise: 0.001249
            gyr_noise: 0.000208
            acc_bias: 0.000106
            gyr_bias: 0.000004
            topic: "/ouster/imu"     # live Ouster ROS2 driver (was /os1_cloud_node/imu for NCD bags)

        # COIN-LIO LiDAR-intensity direct-photometric residual fused into the IKFoM update.
        # v1: "strongest" feature selection, constant photo weight, no rolling-shutter undistort.
        photometric:
            enable: true
            cloud_topic: "/ouster/points"  # ORGANIZED cloud (dense 64x1024) for the photometric image
            # Photometric Jacobian (dI/du . du/dp) has O(1e3) magnitude vs geometric O(1),
            # so in the information-form weighting (HTH = sum w*h^T h) it must be ~1e-9 to
            # balance geometric, else it dominates and diverges. Sweep on apartment bag:
            # 1e-6 -> NaN; 1e-9 -> stable (loop 0.006m); 1e-12 -> stable but ~neutral.
            # Tune UP toward the stability boundary on a DEGENERATE scene for real benefit.
            photo_scale: 1.0e-9      # constant photometric row weight (inverse-variance vs geo)
            photo_deg_gain: 0.0      # obs_score-modulated up-weight (v2; 0 = constant weight)
            rows: 64                 # OS1-64 beams
            cols: 1024               # intensity-image width (azimuth bins)
            beam_offset_mm: 15.806   # from 192.168.2-metadata.json
            intensity_scale: 0.25
            reflectivity: false
            patch_size: 5
            num_features: 65
            min_range: 0.3
            max_range: 50.0
            # beam_altitude_angles defaults to the OS1-64 metadata values baked into InitPhotometric.
